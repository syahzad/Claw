<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120c08">
  <title>The Royal Claw · Medieval Claw Machine</title>
  <meta name="description" content="Test your fortune at the Royal Claw, a medieval fantasy claw machine.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Rune glyph library (Elder Futhark style strokes), reused by the glowing frame -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="r0" viewBox="0 0 10 20"><path d="M1 1V19M1 6L9 1M1 12L9 7"/></symbol>
    <symbol id="r1" viewBox="0 0 10 20"><path d="M1 19V1L9 7V19"/></symbol>
    <symbol id="r2" viewBox="0 0 10 20"><path d="M1 1V19M1 5L9 10L1 15"/></symbol>
    <symbol id="r3" viewBox="0 0 10 20"><path d="M1 1V19M1 3L9 8M1 9L9 14"/></symbol>
    <symbol id="r4" viewBox="0 0 10 20"><path d="M1 1V19M1 1L9 6L1 11L9 19"/></symbol>
    <symbol id="r5" viewBox="0 0 10 20"><path d="M9 4L1 10L9 16"/></symbol>
    <symbol id="r6" viewBox="0 0 10 20"><path d="M1 2L9 18M9 2L1 18"/></symbol>
    <symbol id="r7" viewBox="0 0 10 20"><path d="M1 2L9 18V2L1 18Z"/></symbol>
    <symbol id="r8" viewBox="0 0 10 20"><path d="M5 19V1M5 9L1 3M5 9L9 3"/></symbol>
    <symbol id="r9" viewBox="0 0 10 20"><path d="M1 1V19M1 1L9 6L1 11"/></symbol>
  </defs>
</svg>

<div class="hall" aria-hidden="true">
  <div class="hall-wall"></div>
  <div class="hall-glow"></div>
  <div class="embers" id="embers"></div>
</div>

<main class="viewport">
  <div class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <div class="cabinet" id="cabinet">

        <!-- ================= CROWN (castle top) ================= -->
        <header class="crown">
          <div class="merlons"></div>
          <div class="torch torch-l"><i class="flame"></i><b class="cup"></b></div>
          <div class="torch torch-r"><i class="flame"></i><b class="cup"></b></div>
          <div class="banner">
            <span class="banner-sub">~ Hall of Wonders ~</span>
            <h1>The Royal Claw</h1>
            <span class="banner-sub small">Seize thy fortune</span>
          </div>
        </header>

        <!-- ================= GLASS WINDOW ================= -->
        <section class="window">
          <div class="lintel"><div class="runes runes-h" id="runesTop"></div></div>
          <div class="runes runes-v rv-l" id="runesLeft"></div>
          <div class="runes runes-v rv-r" id="runesRight"></div>

          <div class="pit" id="pit">
            <div class="backwall"></div>
            <div class="floor"></div>

            <div class="rail"><div class="rail-bar"></div></div>

            <div class="carriage" id="carriage">
              <div class="beam" id="beam"></div>
              <div class="trolley"></div>
              <div class="rope" id="rope"></div>
              <div class="claw" id="claw" style="--arm:32">
                <svg viewBox="0 0 68 80" width="68" height="80" aria-hidden="true">
                  <defs>
                    <linearGradient id="ironG" x1="0" x2="1">
                      <stop offset="0" stop-color="#2a2d33"/><stop offset=".45" stop-color="#9aa0ab"/><stop offset="1" stop-color="#32353c"/>
                    </linearGradient>
                    <linearGradient id="ironV" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#b9bec8"/><stop offset=".5" stop-color="#6a6f7a"/><stop offset="1" stop-color="#2b2e35"/>
                    </linearGradient>
                  </defs>
                  <!-- rear arm -->
                  <g class="arm-c"><path d="M34 22 C34 40 34 52 34 64 L38 76 L30 76 Z" fill="#454952" stroke="#16171a" stroke-width="1"/></g>
                  <!-- left & right arms -->
                  <g class="arm-l"><path d="M-3 0 C-12 14 -12 34 -2 50 L2 58 L5 46 C-1 34 -1 16 4 2 Z" fill="url(#ironG)" stroke="#16171a" stroke-width="1.2" stroke-linejoin="round"/><circle cx="0" cy="2" r="3.2" fill="#c9a24a" stroke="#3a2a08"/></g>
                  <g class="arm-r"><path d="M3 0 C12 14 12 34 2 50 L-2 58 L-5 46 C1 34 1 16 -4 2 Z" fill="url(#ironG)" stroke="#16171a" stroke-width="1.2" stroke-linejoin="round"/><circle cx="0" cy="2" r="3.2" fill="#c9a24a" stroke="#3a2a08"/></g>
                  <!-- hub -->
                  <rect x="18" y="6" width="32" height="20" rx="5" fill="url(#ironV)" stroke="#16171a" stroke-width="1.2"/>
                  <rect x="14" y="2" width="40" height="8" rx="3" fill="url(#ironG)" stroke="#16171a" stroke-width="1.2"/>
                  <circle cx="34" cy="16" r="4" fill="#5de3d3" opacity=".9"><animate attributeName="opacity" values=".5;1;.5" dur="2.4s" repeatCount="indefinite"/></circle>
                  <circle cx="22" cy="16" r="1.6" fill="#d9b25a"/><circle cx="46" cy="16" r="1.6" fill="#d9b25a"/>
                </svg>
              </div>
            </div>

            <div class="balls" id="balls"></div>

            <!-- Prize chute (stone well with iron grate) -->
            <div class="chute" id="chute">
              <div class="chute-back"></div>
              <div class="chute-lip"><span class="chute-label">PRIZE</span></div>
            </div>

            <div class="toast" id="toast" role="status" aria-live="polite"></div>
            <div class="glass-shine"></div>
          </div>
        </section>

        <!-- ================= CONSOLE ================= -->
        <section class="console">
          <div class="console-plate">
            <div class="ctl-move">
              <button class="btn-move" id="btnLeft" aria-label="Move claw left">
                <svg viewBox="0 0 24 24"><path d="M15 4L7 12L15 20" /></svg>
              </button>
              <button class="btn-move" id="btnRight" aria-label="Move claw right">
                <svg viewBox="0 0 24 24"><path d="M9 4L17 12L9 20" /></svg>
              </button>
              <span class="ctl-cap">MOVE</span>
            </div>

            <div class="ctl-drop">
              <button class="btn-drop" id="btnDrop" aria-label="Drop the claw"><span>DROP</span></button>
            </div>

            <div class="ctl-hud">
              <div class="plaque"><small>ATTEMPTS</small><strong id="hudTries">0</strong></div>
              <div class="plaque"><small>PRIZES</small><strong id="hudPrizes">0</strong></div>
              <button class="btn-sound" id="btnSound" aria-label="Toggle sound" title="Sound"></button>
            </div>
          </div>

          <div class="treasury">
            <span class="treasury-label">TREASURY</span>
            <div class="sockets" id="sockets"></div>
          </div>
        </section>

        <!-- ================= BASE ================= -->
        <footer class="base">
          <div class="base-door"></div>
          <p class="engraved">← → or A D to move · SPACE to drop</p>
          <div class="odds" id="odds"></div>
        </footer>
      </div>
    </div>
  </div>
</main>

<!-- ================= REVEAL / POP-UP ================= -->
<div class="reveal" id="reveal" hidden>
  <div class="vfx vfx-flash" id="vfxFlash"></div>
  <div class="vfx vfx-rays" id="vfxRays"></div>
  <div class="vfx vfx-vignette" id="vfxVignette"></div>

  <div class="reveal-card" id="revealCard" role="dialog" aria-modal="true" aria-live="assertive" aria-labelledby="revealTitle">
    <div class="card-ribbon" id="revealRibbon">TREASURE CLAIMED</div>
    <div class="medal" id="medal"><img id="medalImg" alt="" draggable="false"></div>
    <h2 class="reveal-title" id="revealTitle"></h2>
    <p class="reveal-sub" id="revealSub"></p>
    <button class="btn-claim" id="btnClaim">CLAIM PRIZE</button>
  </div>
</div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="game.js"></script>
</body>
</html>
